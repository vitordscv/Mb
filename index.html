<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade da Semana — Motoboys</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --fundo:#FBFAF6;
    --cartao:#FFFFFF;
    --borda:#E7E4DA;
    --texto:#2B2E2A;
    --texto-fraco:#8A8D84;
    --chumbo:#5B5D59;
    --chumbo-forte:#2E302C;
    --chumbo-fraco:#ECEBE7;
    --azul:#5E8FBF;
    --azul-fraco:#E8EEF5;
    --coral:#E2725B;
    --coral-fraco:#FBEAE6;
    --sombra:0 1px 2px rgba(43,46,42,0.04), 0 4px 14px rgba(43,46,42,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--fundo);
    color:var(--texto);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Fraunces',Georgia,serif;
    letter-spacing:-0.01em;
    font-weight:600;
  }
  .faixa{
    height:5px;
    background:linear-gradient(90deg, var(--chumbo) 0%, var(--chumbo) 50%, var(--azul) 50%, var(--azul) 100%);
    opacity:.7;
  }
  header{
    padding:36px 20px 16px;
    text-align:center;
  }
  header h1{
    font-size:28px;
    margin:0;
  }
  header h1 span{color:var(--chumbo-forte); font-style:italic;}
  header p{color:var(--texto-fraco);margin:8px 0 0;font-size:14px;}

  nav.tabs{
    display:flex;
    justify-content:center;
    gap:8px;
    padding:0 20px 24px;
  }
  nav.tabs button{
    background:var(--cartao);
    border:1px solid var(--borda);
    color:var(--texto-fraco);
    padding:9px 18px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
  }
  nav.tabs button.ativo{
    background:var(--chumbo-forte);
    color:#fff;
    border-color:var(--chumbo-forte);
  }

  main{max-width:720px;margin:0 auto;padding:0 16px 60px;}

  .dia{
    background:var(--cartao);
    border:1px solid var(--borda);
    border-radius:16px;
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:var(--sombra);
  }
  .dia-topo{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    border-bottom:1px solid var(--borda);
    background:var(--chumbo-fraco);
  }
  .dia-nome{font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--chumbo-forte);}
  .dia-nome small{display:block;color:var(--texto-fraco);font-weight:400;font-size:11px;margin-top:2px;}
  .dia-corpo{padding:14px 18px 18px;}

  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--fundo);
    border:1px solid var(--borda);
    padding:6px 12px;
    border-radius:999px;
    font-size:13px;
    margin:0 6px 6px 0;
    color:var(--texto);
  }
  .etq{
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    padding:2px 7px;
    border-radius:999px;
    letter-spacing:.03em;
  }
  .etq.fixo{ background:var(--chumbo-fraco); color:var(--chumbo-forte); }
  .etq.app{ background:var(--azul-fraco); color:var(--azul); }
  .filtro-tipo{
    display:flex; gap:8px; margin-bottom:14px;
  }
  .filtro-tipo button{
    flex:1;
    background:var(--cartao);
    border:1px solid var(--borda);
    color:var(--texto-fraco);
    padding:9px;
    border-radius:10px;
    font-size:12px;
    cursor:pointer;
    font-weight:600;
  }
  .filtro-tipo button.ativo{
    border-color:var(--chumbo-forte);
    color:var(--chumbo-forte);
    background:var(--chumbo-fraco);
  }
  select.tipo-select{ margin-top:8px; }
  .chip button{
    background:none;border:none;color:var(--coral);cursor:pointer;font-size:14px;line-height:1;padding:0;
  }
  .vazio{color:var(--texto-fraco);font-size:13px;font-style:italic;}

  select, input, textarea{
    background:var(--fundo);
    border:1px solid var(--borda);
    color:var(--texto);
    padding:10px 11px;
    border-radius:9px;
    font-size:14px;
    width:100%;
    font-family:inherit;
  }
  select:focus, input:focus, textarea:focus{
    outline:none;
    border-color:var(--chumbo);
    box-shadow:0 0 0 3px var(--chumbo-fraco);
  }
  .linha-form{display:flex;gap:8px;margin-top:10px;}
  .linha-form select{flex:1;}
  button.btn{
    background:var(--chumbo-forte);
    color:#fff;
    border:none;
    font-weight:600;
    padding:10px 18px;
    border-radius:9px;
    cursor:pointer;
    font-size:14px;
    white-space:nowrap;
  }
  button.btn:hover{background:#345942;}
  button.btn.secundario{
    background:var(--cartao);
    border:1px solid var(--borda);
    color:var(--texto);
    font-weight:500;
  }
  button.btn.secundario:hover{background:var(--fundo);}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}

  .obs-item{
    background:var(--azul-fraco);
    border-left:3px solid var(--azul);
    padding:9px 11px;
    border-radius:8px;
    font-size:13px;
    margin-top:6px;
  }
  .obs-item b{color:var(--azul);}
  .obs-item .meta{color:var(--texto-fraco);font-size:11px;margin-top:2px;}

  .card-obs{
    background:var(--cartao);
    border:1px solid var(--borda);
    border-radius:16px;
    padding:18px;
    margin-bottom:20px;
    box-shadow:var(--sombra);
  }
  .card-obs h3{margin:0 0 10px;font-size:15px;color:var(--texto);}

  .login-box{
    max-width:340px;
    margin:60px auto;
    background:var(--cartao);
    border:1px solid var(--borda);
    border-radius:16px;
    padding:26px;
    box-shadow:var(--sombra);
  }
  .login-box h2{font-size:19px;margin-top:0;}
  .login-box label{font-size:12px;color:var(--texto-fraco);display:block;margin:10px 0 4px;font-weight:500;}
  .erro{color:var(--coral);font-size:13px;margin-top:8px;}
  .topo-admin{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:16px;
  }
  .sair{background:none;border:none;color:var(--texto-fraco);font-size:12px;cursor:pointer;text-decoration:underline;}
  .badge{
    background:var(--chumbo-fraco);color:var(--chumbo-forte);
    font-size:11px;padding:4px 10px;border-radius:999px;font-weight:700;
  }
  .oculto{display:none !important;}
  .gerenciar-motoboys{
    background:var(--cartao);
    border:1px solid var(--borda);
    border-radius:16px;
    padding:18px;
    margin-bottom:20px;
    box-shadow:var(--sombra);
  }
  .gerenciar-motoboys h3{margin:0 0 10px;font-size:14px;color:var(--texto-fraco);text-transform:uppercase;letter-spacing:.04em;font-family:'Inter',sans-serif;font-weight:700;}
  .lista-motoboys .chip{background:var(--fundo);}
  footer{text-align:center;color:var(--texto-fraco);font-size:11px;padding:24px;opacity:.6;}
</style>
</head>
<body>

<div class="faixa"></div>
<header>
  <h1>Grade da <span>Semana</span></h1>
  <p id="subtitulo">Quem roda em qual dia</p>
</header>

<nav class="tabs">
  <button id="tab-grade" class="ativo" onclick="mostrarAba('grade')">Grade</button>
  <button id="tab-admin" onclick="mostrarAba('admin')">Área do organizador</button>
</nav>

<main>

  <!-- ABA GRADE (pública) -->
  <section id="aba-grade">
    <div class="card-obs">
      <h3>Deixar um recado</h3>
      <label style="color:var(--texto-fraco);font-size:12px;">Seu nome</label>
      <select id="obs-motoboy"></select>
      <label style="color:var(--texto-fraco);font-size:12px;margin-top:8px;display:block;">Sobre qual dia? (opcional)</label>
      <select id="obs-dia">
        <option value="">Geral / não é sobre um dia específico</option>
      </select>
      <label style="color:var(--texto-fraco);font-size:12px;margin-top:8px;display:block;">Mensagem</label>
      <textarea id="obs-mensagem" rows="2" placeholder="Ex: não vou poder vir sexta, troco com alguém?"></textarea>
      <div style="margin-top:10px;text-align:right;">
        <button class="btn" onclick="enviarObservacao()">Enviar recado</button>
      </div>
      <div id="obs-erro" class="erro"></div>
    </div>

    <div class="filtro-tipo">
      <button id="filtro-todos" class="ativo" onclick="filtrarTipo('todos')">Todos</button>
      <button id="filtro-fixo" onclick="filtrarTipo('fixo')">🍕 Fixos da pizzaria</button>
      <button id="filtro-app" onclick="filtrarTipo('app')">📱 App (99/iFood)</button>
    </div>

    <div id="grade-container"></div>
  </section>

  <!-- ABA ADMIN -->
  <section id="aba-admin" class="oculto">

    <div id="login-area">
      <div class="login-box">
        <h2>Entrar como organizador</h2>
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="voce@exemplo.com">
        <label>Senha</label>
        <input type="password" id="login-senha" placeholder="••••••••">
        <button class="btn" style="width:100%;margin-top:14px;" onclick="fazerLogin()">Entrar</button>
        <div id="login-erro" class="erro"></div>
      </div>
    </div>

    <div id="painel-admin" class="oculto">
      <div class="topo-admin">
        <span class="badge">Modo edição</span>
        <button class="sair" onclick="fazerLogout()">Sair</button>
      </div>

      <div class="gerenciar-motoboys">
        <h3>Motoboys cadastrados</h3>
        <div id="lista-motoboys-admin" class="lista-motoboys"></div>
        <div class="linha-form">
          <input type="text" id="novo-motoboy" placeholder="Nome do novo motoboy">
          <select id="novo-motoboy-tipo" style="max-width:170px;">
            <option value="fixo">🍕 Fixo da pizzaria</option>
            <option value="app">📱 App (99/iFood)</option>
          </select>
          <button class="btn" onclick="adicionarMotoboy()">Adicionar</button>
        </div>
      </div>

      <div class="gerenciar-motoboys" id="painel-recados">
        <h3>Recados pendentes</h3>
        <div id="lista-recados-admin"></div>
      </div>

      <div id="grade-admin-container"></div>
    </div>
  </section>

</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

// ====================================================
// CONFIGURAÇÃO — troque pelos dados do SEU projeto Supabase
// (Project Settings → API)
// ====================================================
const SUPABASE_URL = 'https://yvgsphezyshhnfaojaso.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl2Z3NwaGV6eXNoaG5mYW9qYXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTcwMDMsImV4cCI6MjEwMDkzMzAwM30.ZYUmDwprv-vBMYIRUd6GxG9LyQhpxbkLDw9JEbCd4LQ'
// ====================================================

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
window.supabase = supabase

const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado']

let motoboys = []
let grade = []
let observacoes = []
let sessaoAtiva = null
let filtroTipoAtivo = 'todos'

window.filtrarTipo = function(tipo){
  filtroTipoAtivo = tipo
  document.getElementById('filtro-todos').classList.toggle('ativo', tipo==='todos')
  document.getElementById('filtro-fixo').classList.toggle('ativo', tipo==='fixo')
  document.getElementById('filtro-app').classList.toggle('ativo', tipo==='app')
  renderizarGradePublica()
}

function rotuloTipo(tipo){
  return tipo==='app' ? '<span class="etq app">App</span>' : '<span class="etq fixo">Fixo</span>'
}

// ---------- ABAS ----------
window.mostrarAba = function(aba){
  document.getElementById('aba-grade').classList.toggle('oculto', aba!=='grade')
  document.getElementById('aba-admin').classList.toggle('oculto', aba!=='admin')
  document.getElementById('tab-grade').classList.toggle('ativo', aba==='grade')
  document.getElementById('tab-admin').classList.toggle('ativo', aba==='admin')
  if(aba==='admin') verificarSessao()
}

// ---------- CARREGAR DADOS ----------
async function carregarTudo(){
  const [{data:m}, {data:g}, {data:o}] = await Promise.all([
    supabase.from('motoboys').select('*').eq('ativo', true).order('nome'),
    supabase.from('grade').select('*, motoboys(nome, tipo)'),
    supabase.from('observacoes').select('*, motoboys(nome)').order('created_at', {ascending:false})
  ])
  motoboys = m || []
  grade = g || []
  observacoes = o || []
  preencherSelectMotoboys()
  renderizarGradePublica()
  renderizarGradeAdmin()
  renderizarListaMotoboysAdmin()
  renderizarRecadosAdmin()
}

function preencherSelectMotoboys(){
  const sel = document.getElementById('obs-motoboy')
  sel.innerHTML = motoboys.map(m=>`<option value="${m.id}">${m.nome}</option>`).join('')
  const selDia = document.getElementById('obs-dia')
  selDia.innerHTML = '<option value="">Geral / não é sobre um dia específico</option>' +
    DIAS.map((d,i)=>`<option value="${i}">${d}</option>`).join('')
}

// ---------- GRADE PÚBLICA ----------
function renderizarGradePublica(){
  const cont = document.getElementById('grade-container')
  cont.innerHTML = DIAS.map((nomeDia, i)=>{
    let doDia = grade.filter(g=>g.dia_semana===i)
    if(filtroTipoAtivo !== 'todos'){
      doDia = doDia.filter(g=>g.motoboys?.tipo === filtroTipoAtivo)
    }
    const obsDoDia = observacoes.filter(o=>o.dia_semana===i && !o.resolvida)
    const obsGerais = i===0 ? observacoes.filter(o=>o.dia_semana===null && !o.resolvida) : []
    return `
    <div class="dia">
      <div class="dia-topo">
        <div class="dia-nome">${nomeDia}</div>
      </div>
      <div class="dia-corpo">
        ${doDia.length ? doDia.map(g=>`<span class="chip">🏍️ ${g.motoboys?.nome ?? '—'} ${rotuloTipo(g.motoboys?.tipo)}</span>`).join('') : '<div class="vazio">Ninguém escalado ainda</div>'}
        ${obsDoDia.map(o=>`<div class="obs-item"><b>${o.motoboys?.nome ?? 'Alguém'}:</b> ${escapeHtml(o.mensagem)}<div class="meta">${formatarData(o.created_at)}</div></div>`).join('')}
        ${obsGerais.map(o=>`<div class="obs-item"><b>${o.motoboys?.nome ?? 'Alguém'}:</b> ${escapeHtml(o.mensagem)}<div class="meta">Recado geral · ${formatarData(o.created_at)}</div></div>`).join('')}
      </div>
    </div>`
  }).join('')
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML
}
function formatarData(ts){
  const d = new Date(ts)
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}) + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
}

// ---------- ENVIAR OBSERVAÇÃO (público, sem login) ----------
window.enviarObservacao = async function(){
  const motoboy_id = document.getElementById('obs-motoboy').value
  const diaRaw = document.getElementById('obs-dia').value
  const mensagem = document.getElementById('obs-mensagem').value.trim()
  const erroEl = document.getElementById('obs-erro')
  erroEl.textContent = ''

  if(!motoboy_id){ erroEl.textContent = 'Cadastre um motoboy antes (peça pro organizador).'; return }
  if(!mensagem){ erroEl.textContent = 'Escreva a mensagem.'; return }

  const { error } = await supabase.from('observacoes').insert({
    motoboy_id,
    dia_semana: diaRaw === '' ? null : parseInt(diaRaw),
    mensagem
  })
  if(error){ erroEl.textContent = 'Erro ao enviar: ' + error.message; return }
  document.getElementById('obs-mensagem').value = ''
  await carregarTudo()
}

// ---------- LOGIN ADMIN ----------
window.fazerLogin = async function(){
  const email = document.getElementById('login-email').value.trim()
  const senha = document.getElementById('login-senha').value
  const erroEl = document.getElementById('login-erro')
  erroEl.textContent = ''
  const { error } = await supabase.auth.signInWithPassword({ email, password: senha })
  if(error){ erroEl.textContent = 'E-mail ou senha inválidos.'; return }
  verificarSessao()
}

window.fazerLogout = async function(){
  await supabase.auth.signOut()
  verificarSessao()
}

async function verificarSessao(){
  const { data } = await supabase.auth.getSession()
  sessaoAtiva = data.session
  document.getElementById('login-area').classList.toggle('oculto', !!sessaoAtiva)
  document.getElementById('painel-admin').classList.toggle('oculto', !sessaoAtiva)
  if(sessaoAtiva){ renderizarGradeAdmin(); renderizarListaMotoboysAdmin(); renderizarRecadosAdmin() }
}

function renderizarRecadosAdmin(){
  const cont = document.getElementById('lista-recados-admin')
  const pendentes = observacoes.filter(o=>!o.resolvida)
  if(!pendentes.length){
    cont.innerHTML = '<div class="vazio">Nenhum recado pendente 🎉</div>'
    return
  }
  cont.innerHTML = pendentes.map(o=>`
    <div class="obs-item" style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
      <div>
        <b>${o.motoboys?.nome ?? 'Alguém'}</b> ${o.dia_semana!==null ? '· '+DIAS[o.dia_semana] : '· geral'}
        <div>${escapeHtml(o.mensagem)}</div>
        <div class="meta">${formatarData(o.created_at)}</div>
      </div>
      <button class="btn secundario" style="white-space:nowrap;" onclick="marcarResolvida('${o.id}')">✓ Resolver</button>
    </div>
  `).join('')
}

window.marcarResolvida = async function(id){
  const { error } = await supabase.from('observacoes').update({ resolvida: true }).eq('id', id)
  if(error){ alert('Erro: ' + error.message); return }
  await carregarTudo()
}

// ---------- ADMIN: MOTOBOYS ----------
function renderizarListaMotoboysAdmin(){
  const cont = document.getElementById('lista-motoboys-admin')
  cont.innerHTML = motoboys.map(m=>
    `<span class="chip">${m.nome} ${rotuloTipo(m.tipo)} <button onclick="removerMotoboy('${m.id}')">✕</button></span>`
  ).join('') || '<div class="vazio">Nenhum motoboy cadastrado</div>'
}

window.adicionarMotoboy = async function(){
  const input = document.getElementById('novo-motoboy')
  const tipoSel = document.getElementById('novo-motoboy-tipo')
  const nome = input.value.trim()
  if(!nome) return
  const { error } = await supabase.from('motoboys').insert({ nome, tipo: tipoSel.value })
  if(error){ alert('Erro: ' + error.message); return }
  input.value = ''
  await carregarTudo()
}

window.removerMotoboy = async function(id){
  if(!confirm('Remover este motoboy? Isso também remove ele da grade.')) return
  const { error } = await supabase.from('motoboys').update({ ativo:false }).eq('id', id)
  if(error){ alert('Erro: ' + error.message); return }
  await carregarTudo()
}

// ---------- ADMIN: GRADE ----------
function renderizarGradeAdmin(){
  const cont = document.getElementById('grade-admin-container')
  cont.innerHTML = DIAS.map((nomeDia, i)=>{
    const doDia = grade.filter(g=>g.dia_semana===i)
    const disponiveis = motoboys.filter(m=>!doDia.some(g=>g.motoboy_id===m.id))
    return `
    <div class="dia">
      <div class="dia-topo"><div class="dia-nome">${nomeDia}</div></div>
      <div class="dia-corpo">
        ${doDia.length ? doDia.map(g=>`<span class="chip">🏍️ ${g.motoboys?.nome ?? '—'} <button onclick="removerDaGrade('${g.id}')">✕</button></span>`).join('') : '<div class="vazio">Ninguém escalado</div>'}
        <div class="linha-form">
          <select id="sel-add-${i}" ${disponiveis.length===0?'disabled':''}>
            ${disponiveis.length ? disponiveis.map(m=>`<option value="${m.id}">${m.nome} — ${m.tipo==='app'?'App':'Fixo'}</option>`).join('') : '<option>Todos já escalados</option>'}
          </select>
          <button class="btn secundario" ${disponiveis.length===0?'disabled':''} onclick="adicionarNaGrade(${i})">+ Escalar</button>
        </div>
      </div>
    </div>`
  }).join('')
}

window.adicionarNaGrade = async function(diaIndex){
  const sel = document.getElementById('sel-add-'+diaIndex)
  const motoboy_id = sel.value
  if(!motoboy_id) return
  const { error } = await supabase.from('grade').insert({ dia_semana: diaIndex, motoboy_id })
  if(error){ alert('Erro: ' + error.message); return }
  await carregarTudo()
}

window.removerDaGrade = async function(id){
  const { error } = await supabase.from('grade').delete().eq('id', id)
  if(error){ alert('Erro: ' + error.message); return }
  await carregarTudo()
}

// ---------- INICIALIZAÇÃO ----------
carregarTudo()
verificarSessao()

// Atualiza automaticamente quando algo muda (tempo real)
supabase.channel('mudancas')
  .on('postgres_changes', { event:'*', schema:'public' }, () => carregarTudo())
  .subscribe()
</script>

</body>
</html>
